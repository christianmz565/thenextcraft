# Self-hosted Convex for thenextcraft — extends upstream compose with auth env.
# Usage:
#   1. cp .env.example .env.local  # fill AUTH_GOOGLE_* and SITE_URL
#   2. docker compose up -d
#   3. docker compose exec backend ./generate_admin_key.sh  # → CONVEX_SELF_HOSTED_ADMIN_KEY
#   4. Set in apps/web/.env.local:
#        NEXT_PUBLIC_CONVEX_URL="http://127.0.0.1:3210"
#        CONVEX_SELF_HOSTED_URL="http://127.0.0.1:3210"
#        CONVEX_SELF_HOSTED_ADMIN_KEY="<from step 3>"
#        SITE_URL="http://localhost:3000"
#   5. Google Cloud OAuth: Authorized redirect URI = http://127.0.0.1:3211/api/auth/callback/google
#      (or https://<your-domain>/api/auth/callback/google behind a proxy — must match CONVEX_SITE_ORIGIN)
#   6. Run web: bun --filter web dev  (expects NEXT_PUBLIC_CONVEX_URL) and `bunx --cwd packages/backend convex dev --url http://127.0.0.1:3210 --admin-key <key>` is NOT supported for self-hosted;
#      instead sync functions via `CONVEX_SELF_HOSTED_URL`/`CONVEX_SELF_HOSTED_ADMIN_KEY` env (see https://labs.convex.dev/auth/setup/manual).
# Docs: https://github.com/get-convex/convex-backend/tree/main/self-hosted
# Auth manual setup: https://labs.convex.dev/auth/setup/manual (CLI `convex env set` not supported self-hosted — set env directly in compose).

services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${PORT:-3210}:3210"
      - "${SITE_PROXY_PORT:-3211}:3211"
    volumes:
      - data:/convex/data
    environment:
      # — Convex Auth (manual setup — required) —
      - SITE_URL=${SITE_URL:-http://localhost:3000}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}
      # — Upstream defaults (override via env if needed) —
      - V8_ACTION_USER_TIMEOUT_SECS
      - NODE_ACTION_USER_TIMEOUT_SECS
      - APPLICATION_MAX_CONCURRENT_MUTATIONS=${APPLICATION_MAX_CONCURRENT_MUTATIONS:-16}
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${PORT:-3210}}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${SITE_PROXY_PORT:-3211}}
      - DATABASE_URL
      - DISABLE_BEACON
      - DISABLE_METRICS_ENDPOINT=${DISABLE_METRICS_ENDPOINT:-true}
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
      - DO_NOT_REQUIRE_SSL
      - INSTANCE_NAME
      - INSTANCE_SECRET
      - POSTGRES_URL
      - MYSQL_URL
      - RUST_LOG=${RUST_LOG:-info}
      - S3_ENDPOINT_URL
      - S3_STORAGE_EXPORTS_BUCKET
      - S3_STORAGE_FILES_BUCKET
      - S3_STORAGE_MODULES_BUCKET
      - S3_STORAGE_SEARCH_BUCKET
      - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET
      - AWS_ACCESS_KEY_ID
      - AWS_REGION
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${DASHBOARD_PORT:-6791}:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:${PORT:-3210}}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
